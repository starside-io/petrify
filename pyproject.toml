[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petrify"
version = "0.1.0"
description = "Freeze the world. Keep the clock ticking. — background-freeze pipeline with live timestamp overlay for security camera footage."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "starside.io", email = "hello@starside.io" }]
maintainers = [{ name = "starside.io", email = "hello@starside.io" }]
requires-python = ">=3.10"
keywords = [
    "video", "motion-detection", "opencv", "ffmpeg",
    "cinemagraph", "security-camera", "background-subtraction",
    "privacy", "person-detection", "hog", "mog2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Security",
]
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# petrify calls ffmpeg directly via subprocess — install the system binary:
#   macOS:   brew install ffmpeg
#   Ubuntu:  apt install ffmpeg
#   Windows: https://ffmpeg.org/download.html
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
virtualcam = ["pyvirtualcam>=0.11"]

[project.scripts]
petrify = "petrify.cli:main"

[project.urls]
Homepage = "https://starside.io"
Repository = "https://github.com/starside-io/petrify"
Issues = "https://github.com/starside-io/petrify/issues"
Changelog = "https://github.com/starside-io/petrify/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["petrify"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "golden: parity tests against committed golden fixtures (slow, need the demo clips in data/)",
]
